<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | amaze-on</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f3f5f8;
            color: #0f1111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #131921;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #f3a847;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .logo span {
            color: #f3a847;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background-color: #ffffff;
            border: 1px solid #d5d9d9;
            border-radius: 8px;
            padding: 28px 26px;
            box-shadow: 0 2px 5px rgba(15, 17, 17, 0.05);
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f1111;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 38px;
            padding: 6px 12px;
            font-size: 0.9rem;
            border: 1px solid #888c8c;
            border-radius: 6px;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: #e47911;
            box-shadow: 0 0 0 3px rgba(228, 121, 17, 0.25);
        }

        .btn-primary {
            width: 100%;
            height: 40px;
            margin-top: 8px;
            background: #f3a847;
            border: 1px solid #e29227;
            border-radius: 6px;
            color: #0f1111;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: background-color 0.15s ease;
        }

        .btn-primary:hover {
            background: #e47911;
        }

        .divider {
            position: relative;
            text-align: center;
            margin: 26px 0 16px;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #e7e7e7;
            z-index: 1;
        }

        .divider span {
            position: relative;
            z-index: 2;
            background: #ffffff;
            padding: 0 10px;
            font-size: 0.78rem;
            color: #767676;
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 38px;
            background: #ffffff;
            border: 1px solid #d5d9d9;
            border-radius: 6px;
            color: #0f1111;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .btn-secondary:hover {
            background: #f7fafa;
            border-color: #a8acad;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            amaze<span>-on</span>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <h1>Create Account</h1>

            <form action="index.html" method="POST">
                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="First and last name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Mobile number or email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Re-enter password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary">Create your amaze-on account</button>
            </form>

            <div class="divider">
                <span>Already have an account?</span>
            </div>

            <a href="index.html" class="btn-secondary">Sign in</a>
        </div>
    </main>

</body>
</html>
