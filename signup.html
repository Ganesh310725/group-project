<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Create Account | amaze-on</title>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            amaze<span>-on</span>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <h1>Create Account</h1>

            <form id="signup-form">
                <div class="form-group">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="First and last name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Mobile number or email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Re-enter password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required autocomplete="new-password" minlength="6">
                </div>

                <p id="signup-error" style="color:#c94a3f; font-size:0.82rem; margin-bottom:12px; display:none;"></p>

                <button type="submit" class="btn-primary">Create your amaze-on account</button>
            </form>

            <div class="divider">
                <span>Already have an account?</span>
            </div>

            <a href="login.html" class="btn-secondary">Sign in</a>
        </div>
    </main>

    <script>
        /* ------------------------------------------------------------------ */
        /* Same fix as login.html: no backend exists, so this must NOT submit  */
        /* via a real HTTP POST (that's what was causing the 405 error).       */
        /* We intercept submit, validate client-side, save the name to         */
        /* localStorage, then redirect with a normal GET navigation.           */
        /* ------------------------------------------------------------------ */
        document.getElementById("signup-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const errorEl = document.getElementById("signup-error");

            if (password !== confirmPassword) {
                errorEl.textContent = "Passwords do not match.";
                errorEl.style.display = "block";
                return;
            }

            errorEl.style.display = "none";
            localStorage.setItem("amazeon_user", name);
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
