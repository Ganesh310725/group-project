site:
  name: "amaze-on"
  title: "amaze-on — search & shop"
  language: "en"
  theme:
    primary: "#262b5c"
    secondary: "#ffb020"
    background: "#ffffff"
    surface: "#f2f3f8"
    text: "#20222c"
    muted: "#6b6f85"

header:
  logo:
    text: "amaze"
    suffix: "-on"
    suffix_color: "#ffb020"

  search:
    enabled: true
    placeholder: "Search amaze-on for anything..."
    role: "search"
    behavior: "filter-products"

  account:
    logged_out:
      visible: true
      button:
        text: "Log in"
        href: "login.html"

    logged_in:
      visible: false
      greeting: "Hi, {user}"
      logout_text: "Log out"
      storage_key: "amazeon_user"

  cart:
    enabled: true
    label: "Cart"
    storage_key: "amazeon_cart"
    drawer:
      width: "400px"
      max_width: "92vw"
      overlay: true
      close_on_escape: true

tagline:
  text: "Search it, add it, amaze yourself with how fast it shows up."
  emphasized_word: "amaze"

products:
  layout:
    columns:
      desktop: 3
      tablet: 2
      mobile: 1
    gap: "26px"
    max_width: "1180px"

  catalog:
    - id: "p1"
      name: "Cloudstep Running Shoes"
      description: "Lightweight everyday trainers with breathable mesh and cushioned soles."
      price: 59.99
      rating: "4.5 (2,301)"

    - id: "p2"
      name: "AuraBrew Coffee Maker"
      description: "12-cup drip machine with a built-in grinder and keep-warm plate."
      price: 74.50
      rating: "4.3 (958)"

    - id: "p3"
      name: "Nomad 20L Backpack"
      description: "Water-resistant daypack with a padded laptop sleeve and side pockets."
      price: 42.00
      rating: "4.6 (1,477)"

    - id: "p4"
      name: "Lumen Desk Lamp"
      description: "Adjustable LED lamp with three brightness levels and USB charging port."
      price: 28.99
      rating: "4.4 (612)"

    - id: "p5"
      name: "EchoSound Earbuds"
      description: "True wireless earbuds with active noise cancellation and 24-hour battery."
      price: 89.00
      rating: "4.2 (3,140)"

    - id: "p6"
      name: "Terra Cast Iron Pan"
      description: "Pre-seasoned 12-inch skillet built for stovetop, oven, or campfire."
      price: 35.75
      rating: "4.7 (2,005)"

    - id: "p7"
      name: "Flexi Yoga Mat"
      description: "Non-slip 6mm mat with carry strap, ideal for yoga, pilates, or stretching."
      price: 24.99
      rating: "4.5 (874)"

    - id: "p8"
      name: "Pulse Fitness Tracker"
      description: "Tracks steps, heart rate, and sleep with a 10-day battery life."
      price: 49.99
      rating: "4.1 (1,690)"

    - id: "p9"
      name: "Hearth Ceramic Mug Set"
      description: "Set of 4 stoneware mugs, dishwasher and microwave safe."
      price: 19.50
      rating: "4.8 (536)"

cart:
  initial_state: {}

  behavior:
    add_product: true
    remove_product: true
    update_quantity: true
    minimum_quantity: 1
    maximum_quantity: 99
    persist_to_local_storage: true

  display:
    show_item_count: true
    show_unit_price: true
    show_line_total: true
    show_subtotal: true

  checkout:
    enabled: true
    empty_cart_message: "Your cart is empty — add a product first."
    placeholder_action: "Show checkout total"
    currency: "USD"

search:
  enabled: true
  search_fields:
    - "name"
    - "description"
  case_sensitive: false
  behavior: "hide-nonmatching-products"

authentication:
  storage_key: "amazeon_user"

  login:
    page: "login.html"
    on_success:
      save_user_to_local_storage: true
      redirect_to: "index.html"

  logout:
    remove_user_from_local_storage: true

storage:
  cart_key: "amazeon_cart"
  user_key: "amazeon_user"

accessibility:
  search_label: "Search products"
  cart_role: "dialog"
  cart_aria_modal: true
  cart_aria_label: "Your cart"
  close_cart_aria_label: "Close cart"
  keyboard:
    escape_closes_cart: true
  focus_outline: true

responsive:
  breakpoints:
    tablet: "980px"
    mobile: "720px"

  tablet:
    product_columns: 2

  mobile:
    product_columns: 1
    header_wrap: true
    search_full_width: true
    hide_account_greeting: true

animations:
  transitions: true
  reduced_motion_support: true

files:
  html: "index.html"
  css: "styles.css"
  login: "login.html"
